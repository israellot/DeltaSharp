name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
      - name: Build the solution
        run: dotnet build src/DeltaSharp.sln -c Release
      - name: Test .NET 8 through 11
        run: >-
          dotnet test src/UnitTests/SharpFossilUnitTests.csproj -c Release --no-restore
          --settings src/UnitTests/coverage.runsettings --results-directory coverage
      - name: Test .NET Standard on .NET 8
        run: >-
          dotnet test src/UnitTests/SharpFossilUnitTests.csproj -c Release -f net8.0 -p:TestNetStandard=true --no-restore
          --settings src/UnitTests/coverage.runsettings --results-directory coverage
      - name: Test .NET 8 through 11 with 24-bit tables
        run: >-
          dotnet test src/UnitTests/SharpFossilUnitTests.csproj -c Release -p:Enable24BitHashtable=true --no-restore
          --settings src/UnitTests/coverage.runsettings --results-directory coverage
      - name: Test .NET Standard with 24-bit tables on .NET 8
        run: >-
          dotnet test src/UnitTests/SharpFossilUnitTests.csproj -c Release -f net8.0 -p:TestNetStandard=true -p:Enable24BitHashtable=true --no-restore
          --settings src/UnitTests/coverage.runsettings --results-directory coverage
      - name: Merge coverage reports and generate the badge
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --version 5.6.0 --tool-path "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/reportgenerator" '-reports:coverage/**/coverage.cobertura.xml' '-targetdir:coverage-site' '-reporttypes:Html;Badges'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: coverage-site

  publish-coverage:
    name: Publish coverage
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
