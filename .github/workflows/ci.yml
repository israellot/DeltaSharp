name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
      - name: Build the solution
        run: dotnet build src/DeltaSharp.sln -c Release
      - name: Test .NET 8 through 11
        run: >-
          dotnet test src/UnitTests/SharpFossilUnitTests.csproj -c Release --no-restore
          --settings src/UnitTests/coverage.runsettings --results-directory coverage
      - name: Test .NET Standard on .NET 8
        run: >-
          dotnet test src/UnitTests/SharpFossilUnitTests.csproj -c Release -f net8.0 -p:TestNetStandard=true --no-restore
          --settings src/UnitTests/coverage.runsettings --results-directory coverage
      - name: Test .NET 8 through 11 with 24-bit tables
        run: >-
          dotnet test src/UnitTests/SharpFossilUnitTests.csproj -c Release -p:Enable24BitHashtable=true --no-restore
          --settings src/UnitTests/coverage.runsettings --results-directory coverage
      - name: Test .NET Standard with 24-bit tables on .NET 8
        run: >-
          dotnet test src/UnitTests/SharpFossilUnitTests.csproj -c Release -f net8.0 -p:TestNetStandard=true -p:Enable24BitHashtable=true --no-restore
          --settings src/UnitTests/coverage.runsettings --results-directory coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: library-coverage
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: error

  publish-coverage:
    name: Publish coverage
    needs: build-and-test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: library-coverage
          path: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: coverage
          use_oidc: true
          fail_ci_if_error: true
